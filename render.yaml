services:
  - type: web
    name: ai-shopping-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ping
    envVars:
      # ── PROVIDERS — ScraperAPI is the default; backups are optional ─────────
      - key: SCRAPERAPI_KEY
        sync: false
      - key: SCRAPINGANT_API_KEY
        sync: false
      - key: BRIGHTDATA_API_KEY
        sync: false
      - key: BRIGHTDATA_ZONE
        value: web_unlocker1
      # ── CORS — set to your exact Vercel URL ───────────────────────────────
      # Example: https://ai-shopping-agent-abc.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false


      # ── Cache — /tmp is always writable on Render free tier ───────────────
      # Note: /tmp is ephemeral (cleared on redeploy/restart).
      # Upgrade to a paid Render plan and add a Disk to get persistent cache.
      - key: CACHE_DIR
        value: /tmp/cache

      # ── Runtime ───────────────────────────────────────────────────────────
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CACHE_TTL_SECONDS
        value: "1800"
      - key: STALE_SERVE_TTL_SECONDS
        value: "21600"
      - key: CACHE_MAX_SIZE_BYTES
        value: "524288000"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "15"
      - key: MAX_RETRIES
        value: "2"
      - key: CONCURRENT_SCRAPE_LIMIT
        value: "4"
      - key: PYTHON_VERSION
        value: "3.12.3"
