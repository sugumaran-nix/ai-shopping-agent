services:
  - type: web
    name: shopiq-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CACHE_DIR
        value: /tmp/.cache
      - key: PYTHON_VERSION
        value: "3.11.0"
