services:
  - type: web
    name: shopiq-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SCRAPERAPI_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CACHE_DIR
        value: /tmp/.cache
      - key: PYTHON_VERSION
        value: "3.11.0"
